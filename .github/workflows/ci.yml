name: CI

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: spotifaychik

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MusicServerLab2.sln

      - name: Test
        run: dotnet test tests/tests.csproj --no-restore --configuration Release --maxcpucount:1

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MusicService.API/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

  notify:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Show published image
        run: |
          echo "Published image:"
          echo "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.docker-build-push.outputs.short_sha }}"

  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Deploy latest image
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -e

          echo "DEPLOY_PATH=$DEPLOY_PATH"

          if [ -z "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH secret is empty"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          pwd
          ls -la

          if [ ! -f docker-compose.yml ]; then
            echo "docker-compose.yml not found in DEPLOY_PATH"
            exit 1
          fi

          export APP_IMAGE_TAG=latest
          export DOCKER_IMAGE_REPOSITORY="${DOCKER_USERNAME}/${IMAGE_NAME}"

          docker compose pull
          docker compose up -d --no-build --scale app=3

      - name: Verify deployment
        run: |
          set -e

          sleep 30

          docker ps

          for i in $(seq 1 10); do
            curl -sk https://localhost/ > /dev/null
          done

          curl -fk https://localhost/health

          ERROR_RATE=$(curl -s "http://localhost:9090/api/v1/query" \
            --data-urlencode 'query=sum(rate(http_requests_received_total{status=~"5.."}[1m]))' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); result=data.get("data",{}).get("result") or []; print(result[0]["value"][1] if result else "0")')

          echo "5xx error rate: $ERROR_RATE"

          python3 - "$ERROR_RATE" <<'PY'
          import sys

          error_rate = float(sys.argv[1])

          if error_rate > 0.05:
              print("Error rate too high, deployment failed")
              raise SystemExit(1)

          print("Deployment verified successfully")
          PY

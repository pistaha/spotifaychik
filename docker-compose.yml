x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ASPNETCORE_URLS: http://+:8080
  Database__ConnectionString: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  JwtSettings__Issuer: ${JWT_ISSUER}
  JwtSettings__Audience: ${JWT_AUDIENCE}
  JwtSettings__Secret: ${JWT_SECRET}
  SecurityAudit__RetentionDays: ${SECURITY_AUDIT_RETENTION_DAYS}
  SecurityAudit__CleanupIntervalHours: ${SECURITY_AUDIT_CLEANUP_INTERVAL_HOURS}
  FileStorage__RootPath: ${FILE_STORAGE_ROOT_PATH}
  FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES}
  FileStorage__MaxTotalUploadBytes: ${FILE_STORAGE_MAX_TOTAL_UPLOAD_BYTES}
  FileStorage__MaxFilesPerUpload: ${FILE_STORAGE_MAX_FILES_PER_UPLOAD}
  FileStorage__StreamingThresholdBytes: ${FILE_STORAGE_STREAMING_THRESHOLD_BYTES}
  FileStorage__AllowAnyFile: ${FILE_STORAGE_ALLOW_ANY_FILE}
  Diagnostics__MemoryStress__Enabled: ${MEMORY_STRESS_ENABLED}
  Diagnostics__MemoryStress__ChunkSizeMb: ${MEMORY_STRESS_CHUNK_SIZE_MB}
  Diagnostics__MemoryStress__MaxChunks: ${MEMORY_STRESS_MAX_CHUNKS}

x-app-common: &app-common
  image: ${DOCKER_IMAGE_REPOSITORY:-your-dockerhub-login/spotifaychik}:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: MusicService.API/Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    <<: *app-environment
  volumes:
    - ./.docker/api-storage:/app/${FILE_STORAGE_ROOT_PATH}
    - /var/run/docker.sock:/var/run/docker.sock:ro
  mem_limit: 256m
  mem_reservation: 192m
  healthcheck:
    test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s
  expose:
    - "8080"
  networks:
    - music-network

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music-network

  app:
    <<: *app-common
    environment:
      <<: *app-environment

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/prometheus.conf:/etc/nginx/conf.d/prometheus.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/static:/usr/share/nginx/html/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/nginx_status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - music-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-nginx-exporter
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    expose:
      - "9113"
    networks:
      - music-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-prometheus
    restart: unless-stopped
    depends_on:
      app:
      
        condition: service_healthy
      nginx-exporter:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.docker/prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - music-network

  loki:
    image: grafana/loki:3.1.1
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./.docker/loki-data:/loki
    networks:
      - music-network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - music-network

  docker-events:
    image: docker:27-cli
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-docker-events
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        docker events \
          --format '{{json .}}' \
          --filter 'label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-music-service}' \
          --filter 'event=oom' \
          --filter 'event=die' \
          --filter 'event=restart'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - music-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: ${COMPOSE_PROJECT_NAME:-music-service}-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - ./.docker/grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - music-network

networks:
  music-network:
    driver: bridge
